[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dxfqa"
version = "0.2.0"
description = "DXF drawing QA checker with safe auto-fix: layer/style rules, geometry and topology checks, JSON + HTML reports"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "ezdxf>=1.4",
    "shapely>=2.0",
]

[project.scripts]
dxfqa = "dxfqa.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
